<!doctype html>
<html>
<head><meta charset="utf-8" /><title>running…</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
  import {
    EmuController, scaledTickNs, MAX_TICK_NS, TURBO_FACTOR,
  } from "../ui/src/workbench/emu.svelte.ts";
  import { Settings, SPEED_PRESETS } from "../ui/src/workbench/settings.svelte.ts";
  import { createCommands, commandsById } from "../ui/src/workbench/commands.svelte.ts";

  const results = [];
  const ok = (name, cond, detail = "") =>
    results.push({ name, pass: !!cond, detail: cond ? "" : detail });

  // ── Spy backend (duck-typed EmulatorBackend) ──
  function makeBackend({ noBundledNoBoot = false } = {}) {
    const calls = [];
    const state = () => ({ a: 1, pc: 0x100 });
    const be = {
      calls,
      listBundledRoms: () => [],
      async loadRom(b) { calls.push("loadRom"); return state(); },
      async loadRomNoBoot(b) { calls.push("loadRomNoBoot"); return state(); },
      async loadDefaultRom() { calls.push("loadDefaultRom"); return state(); },
      async loadBundledRom(id) { calls.push("loadBundledRom:" + id); return state(); },
      async step() { return state(); },
      async tickFrame() { return state(); },
      async setButtons() {},
      async resetGovernor() {},
      async getState() { return state(); },
      async readMemory() { return []; },
      async reset() { calls.push("reset"); },
      async getFrame() { return null; },
      setMasterVolume(v) { calls.push("setMasterVolume:" + v); },
    };
    if (!noBundledNoBoot) {
      be.loadBundledRomNoBoot = async (id) => { calls.push("loadBundledRomNoBoot:" + id); return state(); };
    }
    return be;
  }

  (async () => {
    try {
      // ── TEST 1: scaledTickNs (scale + clamp + guards) ──
      ok("scaled 0ms", scaledTickNs(0, 1) === 0n, String(scaledTickNs(0, 1)));
      ok("scaled 16ms×1", scaledTickNs(16, 1) === 16_000_000n, String(scaledTickNs(16, 1)));
      ok("scaled 16ms×2", scaledTickNs(16, 2) === 32_000_000n, String(scaledTickNs(16, 2)));
      ok("turbo clamps (16ms×8→MAX)", scaledTickNs(16, TURBO_FACTOR) === BigInt(MAX_TICK_NS), String(scaledTickNs(16, 8)));
      ok("stall clamps (1000ms→MAX)", scaledTickNs(1000, 1) === BigInt(MAX_TICK_NS), String(scaledTickNs(1000, 1)));
      ok("negative dt → 0", scaledTickNs(-5, 1) === 0n, String(scaledTickNs(-5, 1)));

      // ── TEST 2: Settings persistence round-trip ──
      localStorage.removeItem("fc-workbench-settings");
      const s0 = new Settings();
      ok("default volume 25%", s0.masterVolume === 0.25, String(s0.masterVolume));
      ok("defaults speed=1", s0.speed === 1);
      ok("defaults skipBoot=false", s0.skipBoot === false);
      ok("defaults lcdEffect=true", s0.lcdEffect === true);
      s0.speed = 2; s0.skipBoot = true; s0.lcdEffect = false; s0.masterVolume = 0.4; s0.save();
      const s1 = new Settings();
      ok("persist speed", s1.speed === 2, String(s1.speed));
      ok("persist skipBoot", s1.skipBoot === true);
      ok("persist lcdEffect", s1.lcdEffect === false);
      ok("persist volume", Math.abs(s1.masterVolume - 0.4) < 1e-9, String(s1.masterVolume));
      // invalid speed rejected
      localStorage.setItem("fc-workbench-settings", JSON.stringify({ speed: 3 }));
      ok("rejects non-preset speed", new Settings().speed === 1);

      // ── TEST 3: commands (machine / audio / display) ──
      localStorage.removeItem("fc-workbench-settings");
      const settings = new Settings();
      const emu = new EmuController(makeBackend());
      const cmds = createCommands({ emu, getModel: () => null, setModel: () => {}, settings, panelDefs: [] });
      const byId = commandsById(cmds);

      const speed = byId.get("machine.speed");
      ok("speed is choice", speed?.kind === "choice");
      ok("speed 4 options", speed?.options?.length === 4, String(speed?.options?.length));
      ok("speed value=1", speed?.value() === "1", speed?.value());
      speed?.select("2");
      ok("speed select→settings", settings.speed === 2, String(settings.speed));
      ok("speed value=2", speed?.value() === "2");

      const boot = byId.get("machine.skipBoot");
      ok("boot unchecked", boot?.checked() === false);
      boot?.run();
      ok("boot→settings", settings.skipBoot === true);
      ok("boot→emu.skipBoot", emu.skipBoot === true);

      const turbo = byId.get("machine.turbo");
      ok("turbo unchecked", turbo?.checked() === false);
      turbo?.run();
      ok("turbo→emu.turbo", emu.turbo === true);

      const run = byId.get("machine.run");
      ok("run toggle kind", run?.kind === "toggle");
      ok("run enabled=romLoaded", run?.enabled() === emu.romLoaded);
      ok("run checked=running", run?.checked() === emu.running);

      const lcd = byId.get("display.lcdEffect");
      ok("lcd checked", lcd?.checked() === true);
      lcd?.run();
      ok("lcd→settings", settings.lcdEffect === false);

      const vol = byId.get("audio.volume");
      ok("audio enabled (backend has setMasterVolume)", vol?.enabled() === true);
      vol?.set(0.5);
      ok("volume set", settings.masterVolume === 0.5);

      const palette = cmds.filter((c) => c.kind === "action" || c.kind === "toggle" || c.kind === "choice");
      ok("palette has content", palette.length >= 6, String(palette.length));

      // ── TEST 4: boot-aware load dispatch ──
      const buf = new ArrayBuffer(0x200);
      const e1 = new EmuController(makeBackend());
      e1.skipBoot = false; await e1.loadRomBytes(buf); e1.pause();
      ok("file boot→loadRom", e1.backend.calls.includes("loadRom") && !e1.backend.calls.includes("loadRomNoBoot"), e1.backend.calls.join(","));

      const e2 = new EmuController(makeBackend());
      e2.skipBoot = true; await e2.loadRomBytes(buf); e2.pause();
      ok("file skip→loadRomNoBoot", e2.backend.calls.includes("loadRomNoBoot"), e2.backend.calls.join(","));

      const e3 = new EmuController(makeBackend());
      e3.skipBoot = true; await e3.loadBundled("x"); e3.pause();
      ok("bundled skip→loadBundledRomNoBoot", e3.backend.calls.includes("loadBundledRomNoBoot:x"), e3.backend.calls.join(","));

      const e4 = new EmuController(makeBackend());
      e4.skipBoot = false; await e4.loadBundled("x"); e4.pause();
      ok("bundled boot→loadBundledRom", e4.backend.calls.includes("loadBundledRom:x"), e4.backend.calls.join(","));

      // Fallback: backend lacking the no-boot bundled export (desktop) → boots.
      const e5 = new EmuController(makeBackend({ noBundledNoBoot: true }));
      e5.skipBoot = true; await e5.loadBundled("x"); e5.pause();
      ok("bundled skip fallback→loadBundledRom", e5.backend.calls.includes("loadBundledRom:x"), e5.backend.calls.join(","));

      e1.destroy(); e2.destroy(); e3.destroy(); e4.destroy(); e5.destroy(); emu.destroy();
    } catch (err) {
      results.push({ name: "harness threw", pass: false, detail: String(err && err.stack || err) });
    }

    const failed = results.filter((r) => !r.pass);
    const summary =
      (failed.length === 0 ? "PASS " : "FAIL ") +
      `(${results.length - failed.length}/${results.length})` +
      failed.map((f) => `\n  ✗ ${f.name}: ${f.detail}`).join("");
    document.title = failed.length === 0 ? "PASS" : "FAIL";
    document.getElementById("out").textContent = summary;
  })();
</script>
</body>
</html>
