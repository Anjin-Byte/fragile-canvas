<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>shot</title>
  <style>
    body { margin: 0; background: var(--surface-2); font-family: var(--font-sans); }
    #tb { width: 1440px; }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import "../ui/src/global.css";
  import { mount } from "svelte";
  import { DockModel } from "@gestalt/phi";
  import Toolbar from "../ui/src/workbench/Toolbar.svelte";
  import CommandPalette from "../ui/src/workbench/CommandPalette.svelte";
  import PreferencesModal from "../ui/src/workbench/PreferencesModal.svelte";
  import { Settings } from "../ui/src/workbench/settings.svelte.ts";
  import { createCommands } from "../ui/src/workbench/commands.svelte.ts";
  import { DEFAULT_LAYOUT } from "../ui/src/workbench/layouts.ts";

  const settings = new Settings();
  settings.speed = 2;      // show 2× lit
  settings.masterVolume = 0.25;

  const backend = { setMasterVolume() {} };
  const emu = {
    backend,
    running: false,
    romLoaded: true,
    turbo: false,
    skipBoot: false,
    canStepInstruction: true,
    bundledRoms: [{ id: "tobu", title: "Tobu Tobu Girl DX", author: "Tangram Games" }],
    toggle() {}, stepCycles() {}, stepFrame() {}, stepInstruction() {}, reset() {},
    loadBundled() {}, loadRomBytes() {},
  };

  const model = DockModel.fromStorage("harness-shot", DEFAULT_LAYOUT);
  // Close I/O so one panel toggle reads inactive (like real use).
  const io = model.findPanel("io");
  if (io) model.closePanel(io.id, "io");

  const commands = createCommands({
    emu, getModel: () => model, setModel: () => {}, settings, panelDefs: [
      { id: "screen", title: "Screen", closable: false },
      { id: "cpu", title: "CPU" }, { id: "disasm", title: "Disassembly" },
      { id: "memory", title: "Memory" }, { id: "ppu", title: "PPU" },
      { id: "apu", title: "APU" }, { id: "io", title: "I/O" },
    ],
  });

  const view = location.hash.slice(1) || "toolbar";
  const target = document.getElementById("app");
  if (view === "toolbar") {
    target.id = "tb";
    mount(Toolbar, { target, props: { emu, commands, openPalette() {}, openPreferences() {} } });
  } else if (view === "palette") {
    mount(CommandPalette, { target, props: { commands, open: true, onclose() {} } });
  } else if (view === "prefs") {
    mount(PreferencesModal, { target, props: { commands, open: true, onclose() {} } });
  }
</script>
</body>
</html>
